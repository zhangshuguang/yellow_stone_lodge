name: Check Yellowstone Availability

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write              # needed to commit .seen_lodges back

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: playwright install chromium --with-deps

      - name: Write config
        run: echo "${{ secrets.CONFIG_YAML }}" > config.yaml

      - run: python checker.py
        env:
          YAHOO_SMTP_PASSWORD: ${{ secrets.YAHOO_SMTP_PASSWORD }}

      - name: Persist seen lodges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f .seen_lodges ] && git add .seen_lodges || true
          git diff --staged --quiet || (git commit -m "chore: update seen lodges [skip ci]" && git push)
